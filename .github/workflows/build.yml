name: Build

on:
  #push:
  #  branches: [ "master", "main" ]
  #pull_request:
  #  branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: nmrpflash-linux
            binary_name: nmrpflash
          - os: macos-latest
            artifact_name: nmrpflash-macos
            binary_name: nmrpflash
          - os: windows-latest
            artifact_name: nmrpflash-windows
            binary_name: nmrpflash.exe

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libpcap-dev libnl-3-dev libnl-route-3-dev pkg-config

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: brew install libpcap

    - name: Setup MSYS2 (Windows)
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils mingw-w64-x86_64-imagemagick mingw-w64-x86_64-librsvg make unzip curl git

    - name: Install Npcap SDK (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      run: |
        curl -LO https://npcap.com/dist/npcap-sdk-1.13.zip
        unzip -q npcap-sdk-1.13.zip -d Npcap

    - name: Build (Linux/macOS)
      if: runner.os != 'Windows'
      run: make

    - name: Build (Windows)
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        MINGW: x86_64-w64-mingw32-
      run: make

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.binary_name }}
        retention-days: 30
